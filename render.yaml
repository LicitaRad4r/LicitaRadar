# Serviço de API que já está no Render. O nome é o do painel: LicitaRadar.
# Não aplique este arquivo como blueprint novo: o plano gratuito é um só e isso abriria uma segunda API.
# O Auto-Deploy do painel está em "After CI Checks Pass", o mesmo que autoDeployTrigger abaixo.
# Valores secretos ficam no painel do Render (sync: false). Nenhum deles está aqui.

services:
  - type: web
    name: LicitaRadar
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./server/Dockerfile.render
    dockerContext: ./server
    healthCheckPath: /healthz
    envVars:
      - key: GCLOUD_PROJECT
        value: licitaradar-13047
      - key: INGEST_FONTE
        value: pncp
      - key: CORS_ORIGENS
        value: http://localhost:5173
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INGEST_JOB_TOKEN
        sync: false
