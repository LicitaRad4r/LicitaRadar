openapi: 3.1.0
info:
  title: LicitaRadar API
  version: 0.3.0
  description: |
    Contrato de interface (rascunho v0.2, Checkpoint 2) da API do LicitaRadar.
    Serve de combinado entre backend e frontend. Depois do congelamento da v0.2, campo novo entra livre;
    renomear ou remover um campo só com acordo do backend e do frontend.

    Convenções
    - Corpo e resposta em JSON. Datas em ISO 8601 (`date` ou `date-time`, UTC). Valores em reais (BRL), como número.
    - O navegador nunca acessa o Firestore (regras deny-all): todo dado passa por esta API.
    - Todas as rotas de negócio ficam sob `/v1` e exigem `Authorization: Bearer <ID token do Firebase Auth>`.
      Só `/health` é público.
    - A empresa do usuário vem do claim `empresaId` do ID token, e o papel vem do claim `role` (`decisor` ou `analista`).
      Não existe `empresaId` na URL. O backend grava os claims no primeiro `PUT /v1/perfil` (proposta: quem cria a empresa
      vira `decisor`); depois disso o cliente precisa renovar o token (por exemplo, `getIdToken(true)`).
      Sem o claim `empresaId`, as rotas de negócio respondem `403` com `EMPRESA_NAO_CONFIGURADA`.
    - Permissões por papel (RF03, US06): o `analista` não acessa certidões nem documentos legais ou financeiros. Todas as rotas `/v1/certidoes` respondem `403` com `ACESSO_NEGADO` para ele, e nada é gravado. Perfil, feed e detalhe de edital são liberados para os dois papéis (US08). O `decisor` acessa tudo.
    - A empresa vem só do token. Se a requisição trouxer `orgId` ou `empresaId` na query diferente do claim, a resposta é `403` com `ACESSO_NEGADO`.
    - Token sem o claim `empresaId` ou sem o claim `role` responde `403` com `EMPRESA_NAO_CONFIGURADA` nas rotas de negócio.
    - O frontend lê o papel (`role`) diretamente do ID token (claim), por exemplo para montar o painel do Decisor; não há rota para isso.
    - Um recurso de outra empresa responde `403` com `ACESSO_NEGADO`, sem revelar dados do recurso (CT-SEG-007 e CT-SEG-008). Id inexistente responde `404`.
    - Erros seguem o formato `Erro`, com um `codigo` estável. Listas são paginadas com `page` e `pageSize` (1 a 100, padrão 20).
    - Logs e respostas de erro não incluem dados pessoais nem do recurso: em bloqueios, o log traz só `requestId`, rota e status (CT-SEG-011).

    Rotas: o prefixo canônico é `/v1`, e as mesmas rotas respondem também sem prefixo (por exemplo `GET /feed`, como no plano do Checkpoint 2).
    Escopo do Checkpoint 2: feed (`GET /feed`), filtros (mesmo endpoint), certidões (`GET /certidoes` e `PUT /certidoes/{id}/renovacao`, só decisor) e segurança. Operações marcadas com `x-checkpoint: posterior` ficam para depois.

    Mudanças da v0.1 para a v0.2
    - Documentado que todo acesso a dados passa pela API (regras deny-all do Firestore).
    - Claims `empresaId` e `role` documentados (proposta): gravados no primeiro `PUT /v1/perfil`, que passa a responder `201` nesse caso.
    - Novo `403` com `EMPRESA_NAO_CONFIGURADA` nas rotas de negócio, exceto as de perfil.
    - `Perfil` ganha o campo somente leitura `empresaId`.
    - `Erro.codigo` passa a ter valores fixos (`VALIDACAO`, `NAO_AUTENTICADO`, `EMPRESA_NAO_CONFIGURADA`, `NAO_ENCONTRADO`).
    - `GET /v1/feed` passa a devolver `totalIngeridos` (pedido do frontend, PR #8).

    Mudanças da v0.2 para a v0.3 (revisão do frontend)
    - `Erro.codigo` ganha `ACESSO_NEGADO` (403 por falta de permissão do papel, diferente de `EMPRESA_NAO_CONFIGURADA`) e `ERRO_INTERNO` (500).
    - Novo `PUT /v1/certidoes/{certidaoId}/renovacao` (arquivo de até 5 MB e nova validade). `GET /v1/certidoes` passa a vir ordenada por urgência.
    - Ordem do feed completa e estável (a paginação não repete nem pula edital), detalhada em `GET /feed`.
    - `editalId` (número de controle do PNCP, pode ter `/`) vai codificado na URL (`encodeURIComponent`) e o backend decodifica.
    - Filtros de data (`publicadoDe/Ate`, `prazoDe/Ate`) são dias no horário de Brasília (`America/Sao_Paulo`), com limites inclusivos.
    - O frontend lê `role` direto do ID token (claim), sem rota própria.

    Alinhamento com a documentação (ainda na v0.3)
    - Matriz de permissões definida: `analista` recebe `403` (`ACESSO_NEGADO`) em todo `/v1/certidoes`.
    - Recurso de outra empresa passa a responder `403` (antes `404`), conforme CT-SEG-007 e CT-SEG-008.
    - `CertidaoStatus` passa a `vencida`, `urgente` (0 a 15 dias), `atencao` (16 a 30) e `em_dia` (31 ou mais), contados em dias no horário de Brasília (CT-CERT-001).
    - Renovação aceita PDF, JPG ou PNG de até 5 MB; arquivo inválido ou grande demais responde `400` (sem `413`). A nova validade deve ser posterior a hoje e à validade atual.
    - Desempate do feed: prazo mais próximo, publicação mais recente e id (CT-FEED-002).

    Alinhamento com a documentação e o plano do CP2 (ainda na v0.3)
    - Paginação `page` e `pageSize` em todas as listas (antes `pagina` e `tamanho`).
    - Filtros do feed no padrão do plano: `q`, `uf`, `municipio`, `modalidade`, `publicadoDe/Ate`, `prazoDe/Ate`, `valorMin` e `valorMax`. O filtro `faixa` saiu.
    - `GET /feed` devolve `motivoVazio` e `totalIngeridos`; o item traz `id`, `titulo`, `orgao`, `uf`, `municipio`, `modalidade`, `prazo`, `dataPublicacao`, `valorEstimado`, `score` e `faixa`.
    - `Faixa` ganha `baixa` (0 a 49); alta vai de 80 a 100 e média de 50 a 79.
    - `Certidao` passa a `id`, `nome`, `validade`, `diasRestantes` e `status`; renovação e envio recebem `validade`.
    - `Erro` passa a trazer `requestId`.
    - Saíram as rotas sem base na documentação: feedback do edital, acompanhamento e etapas, alertas, e edição e exclusão de certidão. Se o grupo definir esses comportamentos, voltam com o formato definido.

servers:
  - url: http://localhost:3333
    description: Desenvolvimento local (docker compose)
tags:
  - name: Infra
    description: Verificação de saúde da API.
  - name: Perfil
    description: Filtros fixos da empresa (Perfil de Fornecedor).
  - name: Feed
    description: Editais do PNCP ranqueados por aderência ao perfil.
  - name: Editais
    description: Detalhe de um edital (US12).
  - name: Certidões
    description: Controle de validade das certidões (só decisor).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: obterSaude
      tags: [Infra]
      summary: Verifica se a API está no ar
      security: []
      responses:
        '200':
          description: API no ar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/perfil:
    get:
      operationId: obterPerfil
      tags: [Perfil]
      summary: Lê o Perfil de Fornecedor da empresa
      description: Se o token ainda não tem o claim `empresaId` ou o perfil não foi configurado, devolve 200 com os campos vazios (`ufs` vazio significa nacional) e `empresaId` nulo.
      responses:
        '200':
          description: Perfil atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    put:
      operationId: salvarPerfil
      tags: [Perfil]
      summary: Salva o Perfil de Fornecedor (substitui o anterior)
      description: No primeiro salvamento (proposta), o backend cria a empresa, grava os claims `empresaId` e `role` no usuário e responde `201`. Depois disso, o cliente deve renovar o ID token antes de chamar as demais rotas. Nos salvamentos seguintes responde `200`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Perfil'
      responses:
        '200':
          description: Perfil salvo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '201':
          description: Perfil criado no primeiro salvamento (empresa criada e claims gravados). Renove o ID token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '400':
          $ref: '#/components/responses/Validacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /v1/feed:
    get:
      operationId: listarFeed
      tags: [Feed]
      summary: Feed de editais ranqueados por aderência
      description: |-
        Devolve só editais não descartados pelo perfil, com o score já calculado (a API apenas lê; nenhuma chamada ao PNCP). Ordem fixa: `score` decrescente; empate por prazo mais próximo, depois publicação mais recente, depois `id`. Os filtros só restringem a lista: não recalculam o score e não trazem de volta editais descartados. Filtragem e paginação no servidor. Parâmetro inválido (texto onde se espera número, valor negativo, mínimo maior que o máximo, data inválida) responde `400` com o campo. Meta de desempenho: p95 de leitura de até 800 ms (CT-FILT-009).
      parameters:
        - name: q
          in: query
          description: 'Palavra-chave. Mesmo normalizador do score: sem diferenciar maiúsculas, acentos e plural simples.'
          schema:
            type: string
            minLength: 1
        - name: uf
          in: query
          description: Restringe a estas UFs (repetir o parâmetro ou separar por vírgula).
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Uf'
        - name: municipio
          in: query
          schema:
            type: string
            minLength: 1
        - name: modalidade
          in: query
          schema:
            $ref: '#/components/schemas/Modalidade'
        - name: publicadoDe
          in: query
          description: Dia no horário de Brasília (America/Sao_Paulo), inclusivo.
          schema:
            type: string
            format: date
        - name: publicadoAte
          in: query
          description: Dia no horário de Brasília (America/Sao_Paulo), inclusivo.
          schema:
            type: string
            format: date
        - name: prazoDe
          in: query
          description: Prazo para envio de propostas, a partir de. Dia no horário de Brasília (America/Sao_Paulo), inclusivo.
          schema:
            type: string
            format: date
        - name: prazoAte
          in: query
          description: Prazo para envio de propostas, até. Dia no horário de Brasília (America/Sao_Paulo), inclusivo.
          schema:
            type: string
            format: date
        - name: valorMin
          in: query
          description: Edital sem valor informado não satisfaz um filtro de valor ativo.
          schema:
            type: number
            minimum: 0
        - name: valorMax
          in: query
          schema:
            type: number
            minimum: 0
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página do feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPagina'
        '400':
          $ref: '#/components/responses/Validacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemEmpresa'
  /v1/editais/{editalId}:
    get:
      operationId: obterEdital
      tags: [Editais]
      summary: Detalha um edital
      parameters:
        - $ref: '#/components/parameters/EditalId'
      responses:
        '200':
          description: Edital com a nota calculada para o perfil da empresa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditalDetalhe'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemEmpresa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
      x-checkpoint: posterior
  /v1/certidoes:
    get:
      operationId: listarCertidoes
      tags: [Certidões]
      summary: Lista as certidões da empresa
      description: Somente `decisor`; `analista` recebe 403 `ACESSO_NEGADO`. Lista as certidões da empresa do token com `diasRestantes` e `status` calculados no servidor, da mais urgente para a menos urgente.
      responses:
        '200':
          description: Certidões cadastradas.
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Certidao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemEmpresa'
    post:
      operationId: criarCertidao
      tags: [Certidões]
      summary: Envia uma certidão (arquivo e validade)
      description: Somente `decisor`. PDF, JPG ou PNG de até 5 MB. Sem validade informada, a resposta é 400 (US14).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - arquivo
                - nome
                - validade
              properties:
                arquivo:
                  type: string
                  format: binary
                nome:
                  type: string
                validade:
                  type: string
                  format: date
      responses:
        '201':
          description: Certidão criada.
          headers:
            Location:
              description: Caminho da certidão criada.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certidao'
        '400':
          $ref: '#/components/responses/Validacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemEmpresa'
      x-checkpoint: posterior
  /v1/certidoes/{certidaoId}/renovacao:
    put:
      operationId: renovarCertidao
      tags: [Certidões]
      summary: Renova uma certidão com o novo arquivo e a nova validade
      description: Somente `decisor`; `analista` recebe 403 `ACESSO_NEGADO` e nada é gravado. O arquivo anterior fica inativo (US15). Validade passada, igual ou anterior à atual, ou arquivo inválido (tipo ou mais de 5 MB) respondem 400 indicando o campo, e a certidão anterior fica intacta. Certidão de outra empresa responde 403.
      parameters:
        - $ref: '#/components/parameters/CertidaoId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - arquivo
                - validade
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: PDF, JPG ou PNG, até 5 MB (5 MB exatos é aceito). Arquivo vazio ou de outro tipo é recusado.
                validade:
                  type: string
                  format: date
                  description: Deve ser posterior a hoje (Brasília) e à validade atual.
      responses:
        '200':
          description: Certidão renovada. O status é recalculado na hora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certidao'
        '400':
          $ref: '#/components/responses/Validacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemEmpresa'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token do Firebase Auth (no desenvolvimento, emitido pelo emulador de Auth). Os claims `empresaId` e `role` identificam a empresa e o papel.
  parameters:
    Pagina:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamanho:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EditalId:
      name: editalId
      in: path
      required: true
      description: >-
        Número de controle do PNCP. Pode conter `/` (por exemplo `00394460000141-1-000123/2026`),
        então o cliente envia o valor codificado (`encodeURIComponent`) e o backend decodifica.
      schema:
        type: string
    CertidaoId:
      name: certidaoId
      in: path
      required: true
      schema:
        type: string
  responses:
    Validacao:
      description: Dados inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    SemEmpresa:
      description: 'Acesso recusado. `codigo` EMPRESA_NAO_CONFIGURADA: token sem `empresaId` ou `role` (configure o perfil em PUT /v1/perfil e renove o ID token). `codigo` ACESSO_NEGADO: o papel não permite a ação, o recurso é de outra empresa ou a query traz outra empresa.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          const: ok
        timestamp:
          type: string
          format: date-time
    Erro:
      type: object
      required:
        - codigo
        - mensagem
        - requestId
      properties:
        codigo:
          type: string
          description: Código estável para o frontend tratar.
          enum:
            - VALIDACAO
            - NAO_AUTENTICADO
            - EMPRESA_NAO_CONFIGURADA
            - NAO_ENCONTRADO
            - ACESSO_NEGADO
            - ERRO_INTERNO
        mensagem:
          type: string
        detalhes:
          type: array
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo:
                type: string
              mensagem:
                type: string
        requestId:
          type: string
          description: Identificador da requisição, o mesmo que vai para o log.
    Uf:
      type: string
      pattern: '^[A-Z]{2}$'
      examples: [DF]
    Faixa:
      type: string
      enum:
        - alta
        - media
        - baixa
      description: 'Alta: nota de 80 a 100. Média: 50 a 79. Baixa: 0 a 49 (passou no funil, pontua pouco). Editais descartados pelo funil não aparecem.'
    Segmento:
      type: string
      description: Macrocategoria de atuação (lista inicial, pode crescer).
      enum: [saude, educacao, ti, construcao_civil, servicos_gerais]
    Modalidade:
      type: string
      description: Modalidade de licitação (lista inicial, opcional no MVP).
      enum: [pregao_eletronico, concorrencia, dispensa]
    Perfil:
      type: object
      properties:
        empresaId:
          type:
            - string
            - 'null'
          readOnly: true
          description: Empresa do usuário (claim `empresaId`). Somente leitura; nulo antes do primeiro PUT.
        ufs:
          type: array
          description: Vazio significa nacional (todo o Brasil).
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uf'
        termosChave:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 2
        segmentos:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Segmento'
        modalidades:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Modalidade'
          description: 'Proposta: a primeira da lista é a modalidade prioritária do Score (10 pontos) e as demais são secundárias (5 pontos). A documentação não define como a empresa marca a prioritária.'
        valorMinimo:
          type: [number, 'null']
          minimum: 0
        valorMaximo:
          type: [number, 'null']
          minimum: 0
        prazoMinimoDiasUteis:
          type: [integer, 'null']
          minimum: 0
          description: Oculta editais com prazo restante menor que isto, em dias úteis (padrão 3).
    FeedItem:
      type: object
      required:
        - id
        - titulo
        - orgao
        - uf
        - modalidade
        - prazo
        - score
        - faixa
      properties:
        id:
          type: string
          description: Número de controle do PNCP.
        titulo:
          type: string
          description: Objeto do edital.
        orgao:
          type: string
        uf:
          $ref: '#/components/schemas/Uf'
        municipio:
          type:
            - string
            - 'null'
        modalidade:
          $ref: '#/components/schemas/Modalidade'
        prazo:
          type: string
          format: date-time
          description: Prazo para envio de propostas.
        dataPublicacao:
          type: string
          format: date-time
        valorEstimado:
          type:
            - number
            - 'null'
        score:
          type: integer
          minimum: 0
          maximum: 100
        faixa:
          $ref: '#/components/schemas/Faixa'
    FeedPagina:
      type: object
      required:
        - itens
        - page
        - pageSize
        - total
        - totalIngeridos
        - motivoVazio
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          description: Itens que combinam com os filtros.
        totalIngeridos:
          type: integer
          minimum: 0
          description: Total de editais ingeridos, sem perfil nem filtros.
        motivoVazio:
          oneOf:
            - type: string
              enum:
                - sem_editais
                - todos_descartados
                - filtros
            - type: 'null'
          description: 'Só vem preenchido quando a lista está vazia: `sem_editais` (nada ingerido), `todos_descartados` (o perfil descartou tudo) ou `filtros` (os filtros eliminaram tudo).'
    EditalDetalhe:
      allOf:
        - $ref: '#/components/schemas/FeedItem'
        - type: object
          properties:
            descricao:
              type: string
            linkPncp:
              type: string
              format: uri
              description: Link direto para baixar o documento original no portal do governo (US12).
    CertidaoStatus:
      type: string
      enum:
        - vencida
        - urgente
        - atencao
        - em_dia
      description: 'Calculado no servidor a partir de `validade`, em dias de calendário no horário de Brasília: menos de 0 é `vencida`; de 0 a 15 é `urgente`; de 16 a 30 é `atencao`; 31 ou mais é `em_dia` (sem alerta). Muda na virada do dia em Brasília.'
    Certidao:
      type: object
      required:
        - id
        - nome
        - validade
        - diasRestantes
        - status
      properties:
        id:
          type: string
        nome:
          type: string
        validade:
          type: string
          format: date
        diasRestantes:
          type: integer
          description: Dias de calendário até a validade, no horário de Brasília (negativo se já venceu).
        status:
          $ref: '#/components/schemas/CertidaoStatus'
