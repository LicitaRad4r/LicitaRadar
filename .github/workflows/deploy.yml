# Depois do CI verde na main: publica o front, as regras e os índices do Firestore.
# O nome deste workflow é "Deploy": o smoke test já espera exatamente isso.
# Este arquivo precisa estar na main para o workflow_run disparar.
# Hosting e Firestore usam contas diferentes. Nenhuma das duas é a do Admin SDK do Render.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosting-producao
  cancel-in-progress: false

jobs:
  hosting:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Conferir variáveis do build
        run: |
          set -euo pipefail
          faltando=""
          for nome in VITE_API_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID; do
            eval "valor=\${$nome}"
            if [ -z "$valor" ]; then faltando="$faltando $nome"; fi
          done
          if [ -n "$faltando" ]; then
            echo "Faltam variables:$faltando"
            exit 1
          fi
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}

      - run: npm ci
        working-directory: client

      - name: Build do front
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_MOCK: "false"
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: npm run build

      - name: Publicar o site
        env:
          FIREBASE_SERVICE_ACCOUNT_HOSTING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOSTING }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_HOSTING" ]; then
            echo "Falta o secret FIREBASE_SERVICE_ACCOUNT_HOSTING."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_HOSTING" > "$RUNNER_TEMP/firebase-hosting.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-hosting.json"
          npx --yes firebase-tools@15.33.0 deploy --only hosting --project licitaradar-13047 --non-interactive

  firestore:
    name: regras e índices
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publicar regras e índices
        env:
          FIREBASE_SERVICE_ACCOUNT_FIRESTORE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIRESTORE }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_FIRESTORE" ]; then
            echo "Falta o secret FIREBASE_SERVICE_ACCOUNT_FIRESTORE."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_FIRESTORE" > "$RUNNER_TEMP/firebase-firestore.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-firestore.json"
          npx --yes firebase-tools@15.33.0 deploy --only firestore:rules,firestore:indexes --project licitaradar-13047 --non-interactive
