name: licitaradar

services:
  firebase:
    build: ./infra/firebase
    stop_grace_period: 30s
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-licitaradar}
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9099:9099"
      - "9150:9150"
    volumes:
      - ./firebase.json:/firebase/firebase.json:ro
      - ./firestore.rules:/firebase/firestore.rules:ro
      - firebase-data:/firebase/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    build: ./server
    environment:
      PORT: 3333
      GCLOUD_PROJECT: ${FIREBASE_PROJECT_ID:-demo-licitaradar}
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
    ports:
      - "${API_PORT:-3333}:3333"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      firebase:
        condition: service_healthy

  web:
    build: ./client
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-demo-api-key}
      VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-licitaradar}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL:-http://localhost:9099}
      VITE_FIRESTORE_EMULATOR_HOST: ${VITE_FIRESTORE_EMULATOR_HOST:-localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  firebase-data:
