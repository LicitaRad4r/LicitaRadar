name: licitaradar


services:
  firebase:
    build: ./infra/firebase
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: true
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no .env (cp .env.example .env)}
    ports:
      - "4000:4000"
      - "8080:8080"
      - "9099:9099"
      - "9150:9150"
    volumes:
      - ./firebase.json:/firebase/firebase.json:ro
      - ./firestore.rules:/firebase/firestore.rules:ro
      - firebase-data:/firebase/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    build: ./server
    env_file:
      - path: .env
        required: true
    environment:
      PORT: 3333
      GCLOUD_PROJECT: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no .env}
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
    ports:
      - "${API_PORT:?Defina API_PORT no .env}:3333"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      firebase:
        condition: service_healthy

  web:
    build: ./client
    env_file:
      - path: .env
        required: true
    environment:
      VITE_API_URL: ${VITE_API_URL:?Defina VITE_API_URL no .env}
      VITE_API_MOCK: ${VITE_API_MOCK:-false}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Defina VITE_FIREBASE_API_KEY no .env}
      VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID no .env}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL:?Defina VITE_FIREBASE_AUTH_EMULATOR_URL no .env}
      VITE_FIRESTORE_EMULATOR_HOST: ${VITE_FIRESTORE_EMULATOR_HOST:?Defina VITE_FIRESTORE_EMULATOR_HOST no .env}
    ports:
      - "${WEB_PORT:?Defina WEB_PORT no .env}:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  firebase-data:
